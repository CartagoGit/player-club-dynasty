# Codex config — Player Club Dynasty
# Codex reads workspace AGENTS.md by default; the file is a pointer to
# docs/delendai/AGENT-BOOTSTRAP.md. This file just records the local
# MCP server entry (matches .mcp.json). Paths are relative to the workspace,
# so the file is identical on every machine.

[mcp_servers.delendai]
command = "bun"
args = [
  "./tools/scripts/workspace/run.script.ts",
  "tools/scripts/host/host-server.script.ts",
  "--workspace=.",
  "--config=./delendai.config.json",
  "--preset=swarm",
  "--exclude-plugins=issues,web-fetch,external-mcps",
]
