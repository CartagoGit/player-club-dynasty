# Bun config — workspace is a leaf consumer of the local mcp-vertex checkout
# (not part of its workspace tree). The `link:` protocol in package.json is
# the supported way to point at the local checkout; bun creates the
# `node_modules/@mcp-vertex/<pkg>` symlinks itself.
#
# Override the link target by setting MCP_VERTEX_ROOT in the environment
# AND updating the `link:` paths in package.json + plugins/*/package.json
# (bun does not expand env vars inside `link:` URLs at install time).

[install]
linker = "hoisted"